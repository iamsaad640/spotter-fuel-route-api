[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spotter-fuel-route-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Django==6.1.1", "httpx==0.28.1", "zipcodes==2.0.1", "scipy==1.17.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-django==4.11.1", "ruff==0.13.3", "hypothesis==6.140.3", "coverage==7.10.7", "mypy==1.18.2"]

[tool.setuptools.packages.find]
include = ["spotter*", "routefuel*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "spotter.settings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["routefuel", "spotter"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["routefuel"]
